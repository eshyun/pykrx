[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "pykrx"
version = "1.0.51.3"
description = "KRX data scraping"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Brayden Jo"},
  {name = "Jonghun Yoo"},
]
maintainers = [
  {name = "Brayden Jo", email = "brayden.jo@outlook.com"},
  {name = "Jonghun Yoo", email = "jonghun.yoo@outlook.com"},
  {name = "pystock", email = "pystock@outlook.com"},
  {name = "Eunseok Hyun", email = "eshyun@gmail.com"},
]
keywords = ["KRX", "stock", "bond", "financial", "data", "scraping"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
urls = {Homepage = "https://github.com/sharebook-kr/pykrx/"}
dependencies = [
  "requests>=2.32.0",
  "pandas>=2.2.0,<3.0",
  "numpy>=2.0",
  "xlrd>=2,<3",
  "deprecated>=1.2.14",
  "multipledispatch>=1.0.0",
  "matplotlib>=3.8.0",
  "curl-cffi>=0.7",
  "portalocker",
]


[project.optional-dependencies]
dev = [
  "build",
  "ipdb",
  "ipython",
  "marimo",
  "pdbsublimetextsupport",
  "pyinstrument",
  "pytest>=7.4.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.9.0",
  "pre-commit>=3.5.0",
  "vcrpy>=4.1.0",
  "pytest-vcr>=1.0.0",
  "typer>=0.24.1",
]


[dependency-groups]
dev = [
  "build",
  "ipdb",
  "ipython",
  "marimo",
  "pdbsublimetextsupport",
  "pyinstrument",
  "pytest>=7.4.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.9.0",
  "pre-commit>=3.5.0",
  "vcrpy>=4.1.0",
  "pytest-vcr>=1.0.0",
  "typer>=0.24.1",
]


[tool.setuptools]
zip-safe = false


[tool.setuptools.packages.find]
include = ["pykrx", "pykrx.*"]


[tool.setuptools.package-data]
pykrx = ["*.ttf"]


[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["build", "dist", "pykrx/_version.py"]


[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]
fixable = ["ALL"]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]
"tests/**/*.py" = ["S101"]
"pykrx/stock/stock_api.py" = ["F811"]


[tool.ruff.format]
quote-style = "double"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--disable-warnings",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests (default)",
  "live: marks tests as live server checks (not run in CI)",
  "cassette: specify VCR cassette file for test",
]


[tool.coverage.run]
source = ["pykrx"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__pycache__/*",
  "*/venv/*",
  "*/.venv/*",
]


[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
